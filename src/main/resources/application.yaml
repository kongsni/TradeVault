spring:
  application:
    name: TradeVault

  datasource:
    url: jdbc:h2:mem:tradevault;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

finnhub:
  api:
    base-url: https://finnhub.io/api/v1
    key: ${FINNHUB_API_KEY:dabth7pr01qvvgl6r160dabth7pr01qvvgl6r16g}

server:
  port: 8080